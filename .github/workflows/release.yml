name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
        # You can add macos-latest and ubuntu-22.04 to this array if you want Mac/Linux builds too

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Enable updater config for release builds
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.tauri.updater = [pscustomobject]@{
            active = $true
            dialog = $true
            pubkey = "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEUwQUQwNzBFRjlBRjIzRTQKRUdUa0k2LzVEZ2V0NEFRNHZkZHpIaGI2UDFhWFpyY3lUVXdkM3dRa2FLYWNrZ3pWYzBiaXRScVYK"
            endpoints = @("https://github.com/mayukhjit-c/splicer/releases/latest/download/latest.json")
            windows = [pscustomobject]@{
              installMode = "passive"
            }
          }
          $config | ConvertTo-Json -Depth 100 | Set-Content $configPath

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Splice Desktop v__VERSION__'
          releaseBody: 'Automated release of Splice Desktop.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
